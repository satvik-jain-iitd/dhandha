<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhandha: The Indian Property Card Game (PWA)</title>
    <!-- 
      Guiding Principles for Visual Improvement:
      1. One-Screen Dashboard (No Scrolling)
      2. Clear Hierarchy (Play Online as Priority 1)
      3. Immersive, Game-Like Asset Rendering
    -->
    <style>
        /* CSS Blueprint: Premium Dark Theme, High Contrast */
        :root {
            --bg-deep: #0F172A; /* Deep Navy */
            --bg-card: #1E293B; /* Lighter Slate for containers */
            --text-primary: #FFFFFF;
            --text-secondary: #94A3B8;
            --accent-green: #10B981; /* For Play Online & Cash */
            --accent-amber: #F59E0B; /* Primary Accent/Gold */
            --border: #334155;
            --font-display: 'Montserrat', 'Cabinet Grotesk', 'Fredoka', sans-serif;
            --font-body: 'Poppins', 'Inter', sans-serif;
        }

        /* 
          LAYOUT GRID:
          - Defines a fixed height, non-scroll area.
          - Use flexbox to maintain center alignment on all screens.
        */
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: var(--font-body);
            height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            overflow: hidden; /* CRITICAL: Prevent the 'Scroll of Doom' */
        }

        .app-lobby {
            width: 100%; max-width: 480px; /* Mobile width */
            height: 100%; max-height: 850px; /* Mobile height */
            padding: 1.5rem;
            display: flex; flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* 1. HEADER SECTION */
        .app-header {
            display: flex; justify-content: space-between; align-items: center;
        }
        .app-header .player-info {
            display: flex; align-items: center; gap: 0.75rem;
        }
        .avatar {
            width: 40px; height: 40px;
            background-color: #E2E8F0; /* Light gray placeholder */
            border-radius: 50%; border: 2px solid var(--accent-amber);
        }
        .player-stats {
            display: flex; flex-direction: column;
        }
        .cash { color: var(--accent-green); font-weight: 800; font-size: 1.1rem; }

        .settings-help {
            display: flex; gap: 1rem;
        }
        .icon-btn {
            background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-secondary);
        }
        .help-btn { color: var(--accent-amber); }

        /* 2. HERO AREA & GAME CARD FAN */
        .hero-section {
            flex: 1;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin-top: -1rem; margin-bottom: -1rem;
        }
        .app-title {
            text-align: center; margin-bottom: 0.5rem;
        }
        .app-title h1 {
            font-family: var(--font-display); font-weight: 900; font-size: 2.75rem;
            color: var(--accent-amber); margin: 0; letter-spacing: -2px;
        }
        .app-title p {
            font-size: 0.8rem; color: var(--text-secondary); margin: 0; letter-spacing: 2px;
        }

        /* DYNAMIC CARD FAN: Premium, Non-Clipped Assets */
        .card-fan-display {
            position: relative;
            width: 250px; height: 350px;
            display: flex; justify-content: center; align-items: center;
        }
        .fan-card {
            position: absolute;
            width: 170px; height: 260px;
            background-color: white; /* Base card color */
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            transform-origin: bottom center;
            /* In a real PWA, these are clean SVG/PNG assets */
        }
        /* Rotations: Cleaned up the messy look from the initial screen */
        .fan-card.card-1 { transform: rotate(-15deg) translateX(-60px); z-index: 10; opacity: 0.8; }
        .fan-card.card-2 { transform: rotate(-5deg) translateX(-20px); z-index: 20; }
        .fan-card.card-3 { transform: rotate(5deg) translateX(20px); z-index: 20; border: 2px solid var(--accent-amber); } /* Highlight center card */
        .fan-card.card-4 { transform: rotate(15deg) translateX(60px); z-index: 10; opacity: 0.8; }

        /* 3. GAME MODES CONTROLS */
        .modes-section {
            display: flex; flex-direction: column; gap: 1rem;
        }

        /* PRIMARY CTA (ONLINE KHELO) - Must use high-contrast color */
        .btn-main {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-green) 0%, #166534 100%);
            border: none; border-radius: 16px;
            padding: 1.2rem;
            color: white; font-size: 1.25rem; font-weight: 800;
            display: flex; flex-direction: column; align-items: center;
            position: relative;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.2);
            transition: transform 0.1s ease;
        }
        .btn-main:active { transform: scale(0.97); } /* Tactile feedback */
        .btn-main .badge {
            position: absolute; top: -10px; right: 10px;
            background-color: #EF4444; color: white;
            font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 99px;
            display: flex; align-items: center; gap: 0.2rem;
        }

        /* SECONDARY MODES GRID */
        .modes-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
        }
        .btn-mode {
            background-color: var(--bg-card);
            border: 1px solid var(--border); border-radius: 12px;
            padding: 1rem;
            color: var(--text-primary); font-weight: 600; font-size: 0.95rem;
            display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
            cursor: pointer;
        }
        .btn-mode p { font-size: 0.7rem; color: var(--text-secondary); margin: 0; font-weight: 400; }
        .btn-mode .icon { font-size: 1.25rem; color: var(--accent-amber); }

        /* 4. HELP DRAWER (HIDDEN) */
        .help-drawer {
            position: absolute; bottom: -100%; left: 0;
            width: 100%; height: 80%;
            background-color: var(--bg-card);
            border-top: 1px solid var(--border); border-top-left-radius: 24px; border-top-right-radius: 24px;
            padding: 2rem;
            transition: bottom 0.4s ease-out;
            overflow-y: scroll; /* Text walls belong here, and can scroll */
            box-shadow: 0 -10px 15px -3px rgba(0, 0, 0, 0.4);
            z-index: 100;
        }
        .help-drawer.active { bottom: 0; }
        .drawer-close {
            position: absolute; top: 1rem; right: 1rem; font-size: 1.5rem; color: var(--text-secondary); background: none; border: none; cursor: pointer;
        }
        .help-drawer h2 { color: var(--accent-amber); margin-top: 0; }
        .help-drawer p { color: var(--text-secondary); }

    </style>
</head>
<body>

    <div class="app-lobby">
        
        <!-- HEADER -->
        <header class="app-header">
            <div class="player-info">
                <div class="avatar"></div>
                <div class="player-stats">
                    <span class="cash">₹25,000</span>
                    <span class="level text-secondary">Level 12</span>
                </div>
            </div>
            <div class="settings-help">
                <button class="icon-btn help-btn" id="openHelp">?</button>
                <button class="icon-btn">⚙️</button>
            </div>
        </header>

        <!-- HERO & CARD DISPLAY -->
        <section class="hero-section">
            <div class="app-title">
                <h1>DHANDHA</h1>
                <p>THE INDIAN PROPERTY CARD GAME</p>
            </div>
            <div class="card-fan-display">
                <!-- Clean, high-res assets go here -->
                <div class="fan-card card-1"><img src="/cards/south-mumbai.svg" alt="South Mumbai"></div>
                <div class="fan-card card-2"><img src="/cards/chandni-chowk.svg" alt="Chandni Chowk"></div>
                <div class="fan-card card-3"><img src="/cards/indiranagar.svg" alt="Indiranagar"></div>
                <div class="fan-card card-4"><img src="/cards/deal-breaker.svg" alt="Deal Breaker"></div>
            </div>
        </section>

        <!-- GAME MODES -->
        <section class="modes-section">
            <button class="btn-main">
                <div class="badge"><span class="dot">•</span> Live: 3,450 players</div>
                <span>⚡ PLAY ONLINE</span>
                <span class="text-secondary">(Khelo Internet)</span>
            </button>
            
            <div class="modes-grid">
                <button class="btn-mode">
                    <span class="icon">👥</span>
                    <span>Pass & Play</span>
                    <p>(Local: 2-5 players)</p>
                </button>
                <button class="btn-mode">
                    <span class="icon">📶</span>
                    <span>Hotspot Khelo</span>
                    <p>(No Internet: 2-5 players)</p>
                </button>
            </div>
        </section>

        <!-- FOOTER INFO -->
        <footer class="app-footer text-center mt-6">
            <span class="text-secondary text-xs">A Game by Satvik Jain</span>
        </footer>

        <!-- HELP & RULES DRAWER (TRIGGERED) -->
        <div class="help-drawer" id="helpDrawer">
            <button class="drawer-close" id="closeHelp">×</button>
            <h2>What is Dhandha?</h2>
            <p>Dhandha is a fast-paced digital adaptation of the classic Monopoly Deal card game, reimagined with Indian cities (like Mumbai, Bengaluru, Indore) and direct properties.</p>
            <!-- 
              Move your entire How To Play and Rules content here.
              It now belongs on a 'hidden' pane, not the main lobby.
            -->
        </div>

    </div>

    <!-- JS Blueprint: Trigger the rules pane -->
    <script>
        const helpDrawer = document.getElementById('helpDrawer');
        const openBtn = document.getElementById('openHelp');
        const closeBtn = document.getElementById('closeHelp');

        openBtn.addEventListener('click', () => {
            helpDrawer.classList.add('active');
        });

        closeBtn.addEventListener('click', () => {
            helpDrawer.classList.remove('active');
        });
    </script>
</body>
</html>
